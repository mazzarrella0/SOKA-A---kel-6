# ============================================================
# Parameter eksperimen. Ubah di sini, bukan di kode.
# Nilai bertanda (USULAN) belum final - diputuskan tim.
# ============================================================

# Skenario jumlah task: uji berkala 100-1000, ditambah dataset 2000 dan 3000.
# Dataset >1000 dapat dibuat dengan soka.tools.GenerateGoCJDataset.
task.counts=100,200,300,400,500,600,700,800,900,1000,2000,3000

# Jalankan dataset yang sama berulang kali dan gagalkan run jika objective berbeda.
simulation.repeat.count=3

# Seed random supaya hasil identik di semua laptop
random.seed=42

# Bobot F = w1*M + w2*E + w3*(1-U), total harus 1.0  (USULAN)
weight.makespan=0.4
weight.energy=0.3
weight.utilization=0.3

# MIPS per PE di Host (harus >= MIPS VM tertinggi = 4000)  (USULAN)
host.pe.mips=4000

# Komposisi 8 VM  (USULAN: 3 low + 3 medium + 2 high)
vm.count.low=3
vm.count.medium=3
vm.count.high=2

# Kebijakan pembagian task ke VM: ROUND_ROBIN, MIPS_AWARE
broker.policies=ROUND_ROBIN

# Algoritma scheduling per-VM yang dibandingkan: DRRHA, FCFS, SJF
compare.algorithms=DRRHA,FCFS,SJF
