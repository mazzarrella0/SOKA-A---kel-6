# ============================================================
# Parameter eksperimen DRRHA.
# ============================================================

# Skenario jumlah task GoCJ yang dijalankan.
task.counts=100,200,300,400,500,600,700,800,900,1000,2000,3000

# Minimal 3 pengulangan per skenario untuk validasi determinisme dan agregasi hasil.
simulation.repeat.count=3

# Seed random untuk dataset yang di-generate dan eksperimen deterministik.
random.seed=42

# Bobot objective: F = w1*M + w2*E + w3*(1-U), total bobot = 1.0.
weight.makespan=0.4
weight.energy=0.3
weight.utilization=0.3

# MIPS per PE host, harus >= MIPS VM tertinggi yang dipakai.
host.pe.mips=4000

# Komposisi VM final sesuai spesifikasi: 2 low + 4 medium + 2 high.
vm.count.low=2
vm.count.medium=4
vm.count.high=2

# Definisi sektor infrastruktur: dua DC, empat host heterogen, delapan VM.
datacenter.count=2
host.count=4
vm.count.total=8

